services:
  backend:
    build: ./backend/simpleapi
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - front-network
      - back-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  front:
    build: ./front
    networks:
      - front-network
    restart: unless-stopped

  httpd:
    build: ./http-server
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      FRONT_HOST: ${FRONT_HOST}
      FRONT_PORT: ${FRONT_PORT}
    ports:
      - "80:80"
    networks:
      - front-network
    depends_on:
      - backend
      - front
    restart: unless-stopped

networks:
  front-network:
  back-network:

volumes:
  db-data:
